name: Scheduled QuiltIDE Build

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: quiltide-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev

      - name: Install dependencies
        run: npm ci

      - name: Compile QuiltIDE
        run: npm run compile

      - name: Build Linux package
        run: npm run gulp vscode-linux-x64-min

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: QuiltIDE-linux-x64-${{ github.run_number }}
          path: ../VSCode-linux-x64/**
          if-no-files-found: warn
          retention-days: 14
